<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JFT &amp; SKILLS MOCK TEST</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e1030">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Noto Sans","Noto Sans Bengali",sans-serif;background:#0e1030;color:#fff;min-height:100%;overflow-x:hidden;position:relative;padding:env(safe-area-inset-top,0px) 18px env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;align-items:center}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.bg i:nth-child(1){width:300px;height:300px;background:#ff2d78;top:-80px;left:-90px}
.bg i:nth-child(2){width:320px;height:320px;background:#22c3dc;bottom:-100px;right:-110px}
.bg i:nth-child(3){width:220px;height:220px;background:#7b3fe4;top:42%;left:55%}
main{position:relative;z-index:1;width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center}
.logo{width:116px;height:116px;border-radius:30px;margin-top:34px;display:block;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.25),0 12px 34px rgba(0,0,0,.5)}
h1{font-size:22px;font-weight:800;text-align:center;margin:18px 0 4px;letter-spacing:.4px}
.tag{font-size:14px;opacity:.75;margin-bottom:28px;letter-spacing:.6px}
.boxes{width:100%;display:flex;flex-direction:column;gap:16px;margin-bottom:96px}
.box{position:relative;display:flex;align-items:center;gap:14px;min-height:128px;padding:18px;border-radius:26px;color:#fff;text-decoration:none;overflow:hidden;border:1px solid rgba(255,255,255,.35);box-shadow:0 14px 30px rgba(0,0,0,.4);-webkit-tap-highlight-color:transparent;transition:transform .15s;animation:up .6s both}
.box::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.35),rgba(255,255,255,0) 45%);pointer-events:none}
.box::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.14);right:-40px;top:-50px;pointer-events:none}
.box:active{transform:scale(.97)}
.b1{background:linear-gradient(135deg,#ff2d78,#ff9a3d)}
.b2{background:linear-gradient(135deg,#2b59d6,#22d3c5);animation-delay:.12s}
.ic{flex:none;width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:32px;position:relative;z-index:1}
.nm{flex:1;font-size:21px;font-weight:800;line-height:1.25;position:relative;z-index:1}
.go{flex:none;width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;position:relative;z-index:1}
.b1 .go{color:#ff2d78}.b2 .go{color:#2b59d6}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.box{animation:none}}
#ib{display:none;position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;border:0;border-radius:30px;background:#fff;color:#e0146b;font-weight:800;font-size:16px;padding:13px 22px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.wm{position:fixed;inset:-35%;z-index:0;pointer-events:none;opacity:.13;transform:rotate(-18deg);background:url("icon-192.png") repeat;background-repeat:space;background-size:72px 72px}
main{min-height:100vh;justify-content:center;padding:24px 0 60px}
.boxes{margin-bottom:0}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div class="wm"></div>
<main>
<div class="boxes">
  <a class="box b1" href="https://sswjftmocktest.github.io/sswstore/"><span class="ic">📝</span><span class="nm">JFT &amp; SKILLS MOCK TEST 1</span><span class="go">›</span></a>
  <a class="box b2" href="https://sswjftmocktest.github.io/mock-test-catalog/"><span class="ic">🎯</span><span class="nm">JFT &amp; SKILLS MOCK TEST 2</span><span class="go">›</span></a>
</div>
</main>
<button id="ib"></button>
<script>
const INST={en:"Install app",bn:"অ্যাপ ইনস্টল করুন"};
const lg=(navigator.language||"en").toLowerCase().startsWith("bn")?"bn":"en";
const ib=document.getElementById("ib");
ib.textContent="📲 "+INST[lg];
let dip=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dip=e;ib.style.display="block";});
ib.onclick=()=>{if(dip){dip.prompt();dip.userChoice.finally(()=>{dip=null;ib.style.display="none";});}};
window.addEventListener("appinstalled",()=>{ib.style.display="none";});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
