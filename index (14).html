let lang = "en", items = [], state = "load";
const L = () => LANGS.find(x => x.k === lang);
const t = (key, lg) => { lg = lg || lang; return (T[lg] && T[lg][key]) || (ORD[lg] && ORD[lg][key]) || T.en[key] || ORD.en[key]; };
const num = n => { try { return Number(n).toLocaleString(L().loc); } catch (e) { return String(n); } };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function parseCSV(s) {
  const r = []; let row = [], c = "", q = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (q) { if (ch === '"') { if (s[i+1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(c); c = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && s[i+1] === "\n") i++; row.push(c); r.push(row); row = []; c = ""; }
    else c += ch;
  }
  if (c || row.length) { row.push(c); r.push(row); }
  return r;
}

let errInfo = "";
function render() {
  const g = document.getElementById("g");
  if (state === "load") { g.innerHTML = '<div class="msg">' + t("load") + "</div>"; return; }
  if (state === "err") { g.innerHTML = '<div class="msg">' + t("err") + '</div><div class="msg" style="font-size:12px;opacity:.7">' + esc(errInfo) + "</div>"; return; }
  const k = document.getElementById("q").value.trim().toLowerCase();
  const list = items.filter(o => (o.name + " " + o.category + " " + o.set_info).toLowerCase().includes(k));
  if (!list.length) { g.innerHTML = '<div class="msg">' + t("none") + "</div>"; return; }
  g.innerHTML = list.map(o => {
    const price = parseFloat(o.price) || 0, old = parseFloat(o.old_price) || 0;
    const free = price === 0 || /free|ফ্রি/i.test(o.price);
    const disc = old > price && price > 0 ? Math.round((old - price) / old * 100) : 0;
    const badge = free ? "🎁 " + t("free") : (o.badge || "🔥 " + t("pop"));
    const meta = [o.set_info, o.validity ? t("days").replace("{n}", num(o.validity)) : ""].filter(Boolean).join(" · ");
    const idx = items.indexOf(o);
    const attr = (free && o.link) ? 'href="' + esc(o.link) + '" target="_blank"' : 'href="#" data-i="' + idx + '"';
    const img = o.image ? '<img src="' + esc(o.image) + '" alt="">' : "📝";
    const ph = free ? '<div class="p">' + t("free") + "</div>"
      : '<div class="p">' + esc(money(price, lang)) + (old > price ? "<s>" + esc(money(old, lang)) + "</s><i>-" + num(disc) + "%</i>" : "") + "</div>";
    const btn = free ? '<a class="btn f" ' + attr + '>🎁 ' + t("trial") + "</a>"
      : '<a class="btn" ' + attr + '>🛒 ' + t("order") + "</a>";
    return '<div class="c"><div class="im"><span class="b">' + esc(badge) + "</span>" + img + '</div><div class="in"><div class="n">' + esc(o.name) +
      '</div><div class="st">★★★★★ <span>(' + esc(px("appr")) + ')</span></div>' + ph + '<div class="m">' + esc(meta) + "</div>" + btn + "</div></div>";
  }).join("");
}

function setLang(k) {
  lang = k;
  document.documentElement.lang = k;
  document.body.dir = L().rtl ? "rtl" : "ltr";
  document.getElementById("q").placeholder = t("ph");
  document.getElementById("lb").textContent = "🌐 " + px("lang");
  document.getElementById("ov").classList.remove("o");
  render();
}

function openMenu() {
  document.getElementById("bx").innerHTML = "<h3>🌐 " + esc(px("lang")) + "</h3>" +
    LANGS.map(x => '<button class="' + (x.k === lang ? "a" : "") + '" data-k="' + x.k + '">' + x.label + "</button>").join("");
  document.getElementById("ov").classList.add("o");
}
document.getElementById("lb").onclick = openMenu;
document.getElementById("ov").onclick = e => {
  const b = e.target.closest("button");
  if (b && b.dataset.k) setLang(b.dataset.k);
  else if (e.target.id === "ov") e.target.classList.remove("o");
};
document.getElementById("q").addEventListener("input", render);

const copyText = txt => {
  const fb = () => { const a = document.createElement("textarea"); a.value = txt; a.style.cssText = "position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(a); a.focus(); a.select(); try { document.execCommand("copy"); } catch (er) {} a.remove(); };
  try { if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).catch(fb); else fb(); } catch (er) { fb(); }
};
const VISA = '<span class="cl" style="color:#1a1f71;font-style:italic;font-weight:900">VISA</span>';
const MC = '<span class="cl"><svg width="30" height="20" viewBox="0 0 30 20"><circle cx="10" cy="10" r="9" fill="#eb001b"/><circle cx="20" cy="10" r="9" fill="#f79e1b" fill-opacity=".9"/></svg></span>';
const CARDS = VISA + MC;
const cardsFull = lg => VISA + MC + '<span class="cl">💳 ' + esc(px("cr", lg)) + '</span><span class="cl">💳 ' + esc(px("db", lg)) + '</span><span class="cl">💳 ' + esc(px("ot", lg)) + '</span>';
const cr = (l, v, c, cls) => '<div class="rw' + (cls || "") + '"><span>' + l + '</span><b>' + v + '</b>' + (c === "" ? "" : '<button class="cb2" data-c="' + c + '">' + esc(t2(5, ol)) + '</button>') + '</div>';
const pr = o => parseFloat(o.price) || 0;
let ord = null, ol = "en";

function showOrder() {
  const lg = ol, o = items[ord.sel], price = pr(o), free = price === 0 || /free|ফ্রি/i.test(o.price);
  const bd = ord.pay === "bd";
  const opts = ord.grp.map(i => { const x = items[i], p = pr(x);
    return '<label class="op' + (i === ord.sel ? " on" : "") + '"><input type="radio" name="st" value="' + i + '"' + (i === ord.sel ? " checked" : "") + "><span>" +
      esc(x.set_info || x.name) + (x.validity ? " · " + esc(t("days", lg).replace("{n}", x.validity)) : "") + "</span><b>" + (p === 0 ? esc(t("free", lg)) : esc(money(p, lg))) + "</b></label>"; }).join("");
  const pay = free ? "" :
    '<div class="nm">' + esc(t2(7, lg)) + '</div><div class="tb"><button data-p="bd" class="' + (bd ? "on" : "") + '">' + LG_B + LG_N + '</button><button data-p="bk" class="' + (bd ? "" : "on") + '"><span>🏦 ' + esc(px("bank", lg)) + '</span><span class="chs">' + CARDS + '</span><span class="ac">' + esc(px("all", lg)) + "</span></button></div>" +
    (bd ? '<div class="pb"><div style="margin-bottom:6px">🇧🇩 ' + esc(px("only", lg)) + "</div>" + cr("bKash / Nagad", PAY_NUMBER.replace(/^(\d{5})(\d+)$/, "$1 $2"), PAY_NUMBER) + cr(esc(t2(1, lg)), "৳" + price, "") + "</div>"
        : '<div class="pb"><div class="wm"><img src="' + UCB_FULL + '" alt=""></div><img class="ub" src="' + UCB_TOP + '" alt="UCB Bank"><div style="margin-bottom:8px">' + cardsFull(lg) + '</div><div class="inf"><b>🌍 ' + esc(px("all", lg)) + "</b>" + esc(INFO[lg] || INFO.en) + "</div>" +
          BANK.map((r, i) => cr(esc(i === 0 ? px("lab", lg)[0] : px("lab", lg)[i]), esc(r[1]), r[0] === "Account Number" ? r[1].replace(/ /g, "") : r[1], r[0] === "Account Number" ? " big" : "")).join("") + cr(esc(t2(1, lg)), esc(money(price, lg)) + (lg === "bn" ? "" : " (৳" + price + ")"), "") + "</div>");
  const rtl = LANGS.find(x => x.k === lg).rtl ? "rtl" : "ltr";
  document.getElementById("bx2").innerHTML = '<div class="hd"><h3>🛒 ' + esc(t("order", lg)) + '</h3><button data-x="1">✕</button></div>' +
    '<select id="ol">' + LANGS.map(x => '<option value="' + x.k + '"' + (x.k === lg ? " selected" : "") + ">" + x.label + "</option>").join("") + "</select>" +
    '<div dir="' + rtl + '"><div class="im">' + (o.image ? '<img src="' + esc(o.image) + '" alt="">' : "📝") + '</div><div class="nm">' + esc(o.name) + "</div>" +
    '<div class="nm" style="font-size:13px;color:#888">' + esc(t2(0, lg)) + "</div>" + opts +
    '<div class="tot"><span>' + esc(t2(1, lg)) + "</span><span>" + (free ? esc(t("free", lg)) : esc(money(price, lg))) + "</span></div>" + pay +
    '<input type="text" id="fn" placeholder="' + esc(t2(2, lg)) + '" value="' + esc(ord.name) + '">' +
    '<input type="tel" id="fp" placeholder="' + esc(t2(3, lg)) + '" value="' + esc(ord.phone) + '">' +
    (free ? "" : '<input type="text" id="ft" placeholder="' + esc(px("trx", lg)) + '" value="' + esc(ord.trx) + '">') +
    '</div><a class="go" id="go" href="#">💬 ' + esc(free ? t("send", lg) : px("confirm", lg)) + "</a>";
}
function sendOrder() {
  const lg = ol, o = items[ord.sel], price = pr(o), free = price === 0 || /free|ফ্রি/i.test(o.price);
  const bad = [["fn", ord.name], ["fp", ord.phone]].concat(free ? [] : [["ft", ord.trx]]).filter(x => !x[1].trim());
  if (bad.length) { bad.forEach(x => document.getElementById(x[0]).classList.add("er")); alert(t2(6, lg)); return; }
  const item = o.name + (o.set_info ? " (" + o.set_info + ")" : "");
  const msg = (free ? t("ftr", lg) : t("buy", lg)).replace("{item}", item) +
    (free ? "" : "\n" + t("price", lg) + ": ৳" + price + "\nPayment: " + (ord.pay === "bd" ? "bKash / Nagad (" + PAY_NUMBER + ")" : "Bank Transfer (UCB Bank)")) +
    "\n\n" + t2(2, lg) + ": " + ord.name + "\n" + t2(3, lg) + ": " + ord.phone + (free ? "" : "\nTrxID: " + ord.trx);
  window.open("https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(msg), "_blank");
}
const bx2 = document.getElementById("bx2"), ov2 = document.getElementById("ov2");
document.getElementById("g").addEventListener("click", e => {
  const a = e.target.closest("a[data-i]");
  if (!a) return;
  e.preventDefault();
  const base = items[+a.dataset.i], key = (base.group || base.name).toLowerCase();
  const grp = items.map((x, i) => i).filter(i => (items[i].group || items[i].name).toLowerCase() === key);
  ord = {sel: +a.dataset.i, grp, pay: "bd", name: "", phone: "", trx: ""}; ol = lang;
  showOrder(); ov2.classList.add("o");
});
ov2.onclick = e => { if (e.target.id === "ov2") ov2.classList.remove("o"); };
bx2.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (e.target.closest("#go")) { e.preventDefault(); sendOrder(); return; }
  if (!b) return;
  if (b.dataset.x) ov2.classList.remove("o");
  else if (b.dataset.p) { ord.pay = b.dataset.p; showOrder(); }
  else if (b.dataset.c) { copyText(b.dataset.c); const old = b.textContent; b.textContent = "✓"; setTimeout(() => { b.textContent = old; }, 1500); }
});
bx2.addEventListener("change", e => {
  if (e.target.id === "ol") { ol = e.target.value; showOrder(); }
  else if (e.target.name === "st") { ord.sel = +e.target.value; showOrder(); }
});
bx2.addEventListener("input", e => {
  const m = {fn: "name", fp: "phone", ft: "trx"}[e.target.id];
  if (m) { ord[m] = e.target.value; e.target.classList.remove("er"); }
});

if (SHEET_CSV_URL.indexOf("http") !== 0) { items = DEMO; state = "ok"; render(); }
else {
  const loadCsv = u => fetch(u).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); });
  loadCsv(SHEET_CSV_URL + (SHEET_CSV_URL.includes("?") ? "&" : "?") + "t=" + Date.now())
    .catch(() => loadCsv(SHEET_CSV_URL))
    .then(s => {
      const rows = parseCSV(s).filter(r => r.some(x => x.trim()));
      const h = rows.shift().map(x => x.trim().toLowerCase());
      items = rows.map(r => { const o = {}; h.forEach((k, i) => o[k] = (r[i] || "").trim());
          // আপনার শিটের কলামের নাম -> পেজের নাম
          o.name = o.name || o["set name"] || "";
          o.category = o.category || "";
          o.old_price = o.old_price || o["net price"] || "";
          o.price = o.price || o["discount price"] || o["net price"] || "0";
          o.set_info = o.set_info || o["question set"] || "";
          o.validity = o.validity || o["day limit"] || "";
          o.link = o.link || o["exam link"] || "";
          o.show = o.show || o.status || "";
          return o; })
        .filter(o => o.name && !/^(hide|hidden|no|off|inactive|disabled|closed)$/i.test(o.show || ""));
      state = "ok"; render();
    })
    .catch(er => { errInfo = String((er && er.message) || er); state = "err"; render(); });
}
